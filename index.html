<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automated Wi-Fi Speed & Timeline Monitor</title>
    <!-- Chart.js CDN for the line chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-right: 8px; margin-bottom: 8px;}
        button:hover { background: #0ea5e9; }
        .secondary { background: #334155; color: #cbd5e1; }
        .secondary:hover { background: #475569; }
        .danger { background: #ef4444; color: #fff; }
        .danger:hover { background: #dc2626; }
        .chart-container { position: relative; height: 250px; width: 100%; margin-top: 15px; }
        ul { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        li { padding: 8px 12px; margin-bottom: 6px; background: #0f172a; border-radius: 6px; display: flex; justify-content: space-between; font-size: 14px; }
        .status-active { color: #4ade80; font-weight: bold; }
        .status-paused { color: #f87171; font-weight: bold; }
        
        /* Alert banner styling */
        #alert-banner { display: none; background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* Custom Password Modal overlay (non-blocking) */
        #password-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; width: 300px; text-align: center; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Custom Password Modal (keeps background loops & beeps running) -->
    <div id="password-modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #f8fafc;">Enter Password</h3>
            <input type="password" id="password-input" placeholder="Password required" autocomplete="current-password">
            <br>
            <button onclick="submitPassword()">Confirm</button>
            <button class="secondary" onclick="closePasswordModal()">Cancel</button>
        </div>
    </div>

    <div class="card">
        <h2>Wi-Fi Speed Monitor</h2>
        
        <!-- Warning / Outage Alert Banner -->
        <div id="alert-banner">
            <span id="alert-text">⚠️ Warning: Wi-Fi speed dropped below 5 Mbps!</span> 
            <button id="mute-btn" class="danger" style="padding: 4px 10px; margin-left: 10px; font-size: 12px;" onclick="attemptMute()">Mute Alarm (PW Required)</button>
        </div>

        <p>Status: <span id="auto-status" class="status-active">Running (Every 15 sec)</span></p>
        <p id="current-status">Ready for next scheduled check.</p>
        
        <div>
            <button onclick="runSpeedTest()">Test Now</button>
            <button id="toggle-btn" class="secondary" onclick="toggleAutoTimer()">Pause Auto-Check (PW Required)</button>
            <button class="danger" onclick="clearHistory()">Clear Data (PW Required)</button>
        </div>
    </div>

    <div class="card">
        <h3>Speed Performance Chart</h3>
        <div class="chart-container">
            <canvas id="speedChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>Recent Logs</h3>
        <ul id="timeline-list">
            <!-- Logs populate here -->
        </ul>
    </div>

    <script>
        let speedChart;
        let autoTimer = null;
        let isRunning = true;
        const MAX_HISTORY = 30; 
        
        const LOW_SPEED_THRESHOLD = 5.0; 
        const CORRECT_PASSWORD = "Hayden0401";

        let alarmInterval = null;
        let isAlarmActive = false;
        let isTotalOutage = false; 
        let pendingPasswordCallback = null; 

        function verifyPassword(callback) {
            pendingPasswordCallback = callback;
            document.getElementById('password-input').value = '';
            document.getElementById('password-modal').style.display = 'flex';
            document.getElementById('password-input').focus();
        }

        function submitPassword() {
            const input = document.getElementById('password-input').value;
            if (input === CORRECT_PASSWORD) {
                const callback = pendingPasswordCallback;
                closePasswordModal();
                if (callback) {
                    callback();
                }
            } else {
                alert("Incorrect password!");
            }
        }

        function closePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
            pendingPasswordCallback = null;
        }

        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitPassword();
            }
        });

        function initChart() {
            const ctx = document.getElementById('speedChart').getContext('2d');
            const history = JSON.parse(localStorage.getItem('speedTestHistory') || '[]').reverse();
            
            const labels = history.map(item => item.time);
            const data = history.map(item => item.download);

            speedChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Download Speed (Mbps)',
                        data: data,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', maxTicksLimit: 8 } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, beginAtZero: true }
                    },
                    plugins: {
                        legend: { labels: { color: '#f8fafc' } }
                    }
                }
            });
        }

        async function runSpeedTest(isRetry = false) {
            const statusEl = document.getElementById('current-status');
            if (!isRetry) {
                statusEl.textContent = 'Running test (5 MB stream)...';
            } else {
                statusEl.textContent = 'Verifying with retest...';
            }

            try {
                // 1. Ping Check
                const pingStart = performance.now();
                await fetch('https://www.cloudflare.com/cdn-cgi/trace?' + Math.random(), { method: 'HEAD', mode: 'no-cors' });
                const ping = Math.round(performance.now() - pingStart);

                // 2. Controlled Download Check using a larger 5 MB file to bypass local caching
                const fileUrl = 'https://speed.cloudflare.com/__down?bytes=5000000'; 
                const fileSizeBits = 5000000 * 8; 
                
                const dlStart = performance.now();
                const response = await fetch(fileUrl + '&cacheBust=' + Math.random());
                await response.blob();
                const dlDuration = (performance.now() - dlStart) / 1000;

                const downloadSpeed = ((fileSizeBits / dlDuration) / (1024 * 1024)).toFixed(2);
                const speedNum = parseFloat(downloadSpeed);
                const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                // If low/failing on the first try, wait 0.1 sec and retry ONCE
                if ((speedNum < LOW_SPEED_THRESHOLD || speedNum <= 0.1) && !isRetry) {
                    statusEl.textContent = `Low speed (${downloadSpeed} Mbps). Retrying in 0.1s...`;
                    await new Promise(resolve => setTimeout(resolve, 100)); // 0.1 sec delay
                    return await runSpeedTest(true); // Execute retest once
                }

                const newRecord = { time: now, download: speedNum, ping: ping };

                let history = JSON.parse(localStorage.getItem('speedTestHistory') || '[]');
                history.unshift(newRecord);
                if (history.length > MAX_HISTORY) history.pop();
                localStorage.setItem('speedTestHistory', JSON.stringify(history));

                statusEl.innerHTML = `Latest: <b>${downloadSpeed} Mbps</b> | Ping: <b>${ping} ms</b>`;
                
                // Final evaluation (either original or after successful retest)
                if (speedNum <= 0.1) {
                    triggerTotalOutageAlarm();
                } else if (speedNum < LOW_SPEED_THRESHOLD) {
                    triggerLowSpeedAlarm();
                } else {
                    stopAlarm();
                }

                refreshUI();

            } catch (error) {
                // If it threw a network error on the first attempt, retry once after 0.1 sec
                if (!isRetry) {
                    statusEl.textContent = 'Test hiccup. Retrying in 0.1s...';
                    await new Promise(resolve => setTimeout(resolve, 100));
                    return await runSpeedTest(true);
                } else {
                    // Retry also failed -> trigger total outage alarm
                    statusEl.textContent = 'Test failed (Network offline).';
                    triggerTotalOutageAlarm(); 
                }
            }
        }

        // Web Audio API Beep Generator
        function playBeepTone() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(700, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15); 
            } catch (e) {
                console.log("AudioContext blocked or not supported.");
            }
        }

        function triggerLowSpeedAlarm() {
            isTotalOutage = false;
            document.getElementById('alert-text').textContent = '⚠️ Warning: Wi-Fi speed dropped below 5 Mbps!';
            document.getElementById('mute-btn').style.display = 'inline-block'; 
            document.getElementById('alert-banner').style.display = 'block';

            if (!isAlarmActive) {
                isAlarmActive = true;
                playBeepTone();
                // Beep every 0.5 seconds (500 ms)
                alarmInterval = setInterval(playBeepTone, 500);
            }
        }

        function triggerTotalOutageAlarm() {
            isTotalOutage = true;
            document.getElementById('alert-text').textContent = '🚨 CRITICAL: Wi-Fi is completely down! (CANNOT BE MUTED)';
            document.getElementById('mute-btn').style.display = 'none'; 
            document.getElementById('alert-banner').style.display = 'block';

            if (!isAlarmActive) {
                isAlarmActive = true;
                playBeepTone();
                // Beep every 0.5 seconds (500 ms)
                alarmInterval = setInterval(playBeepTone, 500); 
            }
        }

        function stopAlarm() {
            isTotalOutage = false;
            if (isAlarmActive) {
                isAlarmActive = false;
                clearInterval(alarmInterval);
                alarmInterval = null;
                document.getElementById('alert-banner').style.display = 'none';
            }
        }

        function attemptMute() {
            if (isTotalOutage) {
                alert("Action blocked: The alarm cannot be muted while the Wi-Fi is completely down!");
                return;
            }
            verifyPassword(() => {
                stopAlarm();
            });
        }

        function refreshUI() {
            const history = JSON.parse(localStorage.getItem('speedTestHistory') || '[]');
            
            const listEl = document.getElementById('timeline-list');
            listEl.innerHTML = '';
            if (history.length === 0) {
                listEl.innerHTML = '<li style="color: #64748b; justify-content: center;">No tests recorded yet.</li>';
                return;
            }

            history.forEach(entry => {
                const li = document.createElement('li');
                li.innerHTML = `<span>📅 ${entry.time}</span> <span>⚡ <b>${entry.download} Mbps</b> (${entry.ping} ms ping)</span>`;
                listEl.appendChild(li);
            });

            const reversed = [...history].reverse();
            speedChart.data.labels = reversed.map(i => i.time);
            speedChart.data.datasets[0].data = reversed.map(i => i.download);
            speedChart.update();
        }

        function toggleAutoTimer() {
            verifyPassword(() => {
                const statusLabel = document.getElementById('auto-status');
                const toggleBtn = document.getElementById('toggle-btn');

                if (isRunning) {
                    clearInterval(autoTimer);
                    isRunning = false;
                    statusLabel.textContent = 'Paused';
                    statusLabel.className = 'status-paused';
                    toggleBtn.textContent = 'Resume Auto-Check (PW Required)';
                } else {
                    autoTimer = setInterval(runSpeedTest, 15000); 
                    isRunning = true;
                    statusLabel.textContent = 'Running (Every 15 sec)';
                    statusLabel.className = 'status-active';
                    toggleBtn.textContent = 'Pause Auto-Check (PW Required)';
                }
            });
        }

        function clearHistory() {
            verifyPassword(() => {
                localStorage.removeItem('speedTestHistory');
                stopAlarm();
                refreshUI();
                document.getElementById('current-status').textContent = 'History cleared.';
            });
        }

        window.onload = () => {
            initChart();
            refreshUI();
            autoTimer = setInterval(runSpeedTest, 15000);
        };
    </script>
</body>
</html>
